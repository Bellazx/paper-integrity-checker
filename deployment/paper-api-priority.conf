[Service]
# Dedicated user API capacity on the 192-CPU / 2-TiB host.
Environment="API_MAX_CONCURRENT_TASKS=120"
Environment="API_MAX_CONCURRENT_PAPERS=120"
Environment="API_MAX_PENDING_TASKS=240"
# This host uses cgroup v1. Default CPU shares are 1024; give the API 8x
# relative weight under contention without reserving idle CPUs.
CPUShares=8192
BlockIOWeight=1000
Nice=-5
IOSchedulingClass=best-effort
IOSchedulingPriority=0
