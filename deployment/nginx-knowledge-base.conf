server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    location = /qwen-image-edit {
        return 301 /qwen-image-edit/;
    }

    location ^~ /qwen-image-edit/ {
        proxy_pass http://127.0.0.1:7860/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        add_header Cache-Control "no-store" always;
    }

    location = /flux2 {
        return 301 /flux2/;
    }

    location ^~ /flux2/ {
        proxy_pass http://127.0.0.1:8012/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        sub_filter_once off;
        sub_filter "url: '/openapi.json'" "url: '/flux2/openapi.json'";
        sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/flux2/docs/oauth2-redirect'";

        add_header Cache-Control "no-store" always;
    }

    location = /flux2-ui {
        return 301 /flux2-ui/;
    }

    location ^~ /flux2-ui/ {
        proxy_pass http://127.0.0.1:7862/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        add_header Cache-Control "no-store" always;
    }

    location = /paper-progress {
        return 302 /paper-progress/;
    }

    location ^~ /paper-progress/ {
        proxy_pass http://127.0.0.1:8013/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location = /paper-api {
        return 301 /paper-api/;
    }

    # Preserve the legacy public prefix while the FastAPI application keeps
    # its original unprefixed routes on the local-only listener.
    location ^~ /paper-api/ {
        rewrite ^/paper-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        client_max_body_size 2048M;

        # Keep FastAPI's interactive documentation functional below the
        # externally visible /paper-api prefix.
        sub_filter_once off;
        sub_filter "url: '/openapi.json'" "url: '/paper-api/openapi.json'";
        sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/paper-api/docs/oauth2-redirect'";
    }

    # The read-only gateway resolves both migrated reports and reports created
    # locally after the migration, while retaining all historical URLs.
    location ^~ /chinese_reports/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # English initial-screening reports are served by the same read-only gateway
    # as the migrated Chinese and review PDFs.
    location ^~ /english_reports/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location ^~ /review_reports/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /downloads/yujing_4050_202607_review_high_delta_64_20260918.zip {
        alias /home/sjtu/paper-integrity-checker/data/downloads/yujing_4050_202607_review_high_delta_64_20260918.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="yujing_4050_202607_review_high_delta_64_20260918.zip"' always;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8000/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
